version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: recall-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recall_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: recall-radar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
